<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine Player</title>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.38/dist/spine-player.css">
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.38/dist/iife/spine-player.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #player-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="player-container"></div>
    <script>
        console.log('开始初始化');
        const urlParams = new URLSearchParams(window.location.search);
        const characterId = urlParams.get('id') || 'fuluoluo';
        const basePath = `assets/${characterId}/`;
        const jsonUrl = `${basePath}${characterId}.json`;
        const atlasUrl = `${basePath}${characterId}.atlas`;
        console.log('加载资源:', jsonUrl, atlasUrl);

        const container = document.getElementById('player-container');
        const player = new spine.SpinePlayer(container, {
            jsonUrl: jsonUrl,
            atlasUrl: atlasUrl,
            backgroundColor: '#00000000',
            viewport: { x: 0, y: 0, width: 800, height: 800, padLeft: '10%', padRight: '10%', padTop: '10%', padBottom: '10%' },
            showControls: false,
            animation: 'idle'
        });

        window.player = player;
        console.log('初始化完成', player);
    </script>
</body>
</html>
