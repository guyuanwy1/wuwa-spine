<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wuthering Waves Spine Player</title>
<script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-webgl@4.2/dist/iife/spine-webgl.js"></script>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: transparent;
    overflow: hidden;
}
canvas {
    width: 100%;
    height: 100%;
    display: block;
}
</style>
</head>
<body>
<canvas id="spineCanvas"></canvas>
<script>
async function init() {
    const params = new URLSearchParams(location.search);
    const charId = params.get("id");
    if (!charId) {
        document.body.innerText = "错误：URL缺少 ?id=角色名称 参数";
        return;
    }

    const canvas = document.getElementById("spineCanvas");
    const renderer = new spine.WebGLRenderer(canvas);
    const assetManager = new spine.AssetManager();

    const baseUrl = `assets/${charId}/${charId}`;
    assetManager.loadText(`${baseUrl}.json`);
    assetManager.loadText(`${baseUrl}.atlas`);
    assetManager.loadTexture(`${baseUrl}.png`);

    await new Promise(resolve => assetManager.onSuccess = resolve);

    const skeletonData = assetManager.get(`${baseUrl}.json`);
    const skeleton = new spine.Skeleton(skeletonData);
    const animStateData = new spine.AnimationStateData(skeletonData);
    const animState = new spine.AnimationState(animStateData);

    animState.setAnimation(0, "idle", true);
    const skeletonRenderer = new spine.SkeletonRenderer(renderer);

    function renderLoop() {
        requestAnimationFrame(renderLoop);
        const dpr = window.devicePixelRatio;
        canvas.width = canvas.clientWidth * dpr;
        canvas.height = canvas.clientHeight * dpr;
        renderer.resize(canvas.width, canvas.height);
        renderer.clear(0, 0, 0, 0);

        const deltaTime = 1 / 60;
        animState.update(deltaTime);
        animState.apply(skeleton);
        skeleton.updateWorldTransform();

        skeleton.x = canvas.width / 2;
        skeleton.y = canvas.height;
        skeleton.scaleX = 0.8;
        skeleton.scaleY = 0.8;

        skeletonRenderer.draw(skeleton);
    }
    renderLoop();
}
init();
</script>
</body>
</html>
